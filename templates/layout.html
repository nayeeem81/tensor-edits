<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask App{% endblock %}</title>
<style>
:root {
    color-scheme: light;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    color: #17212b;
    background: #eef3f7;
    --panel: #2c3e50;
    --muted: #687887;
    --ink: #0b098f;
    --red: #b3261e;
    --green: #043b3a;
    --blue: #18148e;
}

/* Base Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* Basic Navigation Styling */
nav {
    background-color: #333;
    display: flex;
    padding: 0 20px;
}

.nav-item {
    position: relative;
    list-style: none;
}

.nav-link {
    display: inline-block;
    color: white;
    padding: 14px 20px;
    text-decoration: none;
    cursor: pointer;
}

    .nav-link:hover, .dropdown-toggle:focus {
        background-color: #111;
    }
/* Hidden Child Menu */
.dropdown-menu {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
    padding: 0;
    margin: 0;
    list-style: none;
}

    .dropdown-menu a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }

        .dropdown-menu a:hover {
            background-color: #f1f1f1;
        }
/* Class added by JavaScript to show menu */
.show {
    display: block;
}




</style>
      <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='audio-edit.css') }}">
     <link rel="stylesheet" href="{{ url_for('static', filename='image-edit.css') }}">
       <link rel="stylesheet" href="{{ url_for('static', filename='vector.css') }}">
       <link rel="stylesheet" href="{{ url_for('static', filename='rotate-face.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='rotate-box.css') }}">
      
</head>
<body>

     <nav class="navbar">

                <ul class="nav-menu">

                    <li><a href="{{ url_for('edit_audio') }}" class="nav-item">Audio</a></li>
                    <li><a href="{{ url_for('edit_image') }}" class="nav-item">Image</a></li>
                    <li><a href="{{ url_for('box_rotate') }}" class="nav-item">Box 3D</a></li>
                    <li><a href="{{ url_for('face_rotate') }}" class="nav-item">Face 3D</a></li>
                    <li><a href="{{ url_for('vector') }}" class="nav-item">Height Map 3D</a></li>

                </ul>
    
    </nav>

    <main style="padding: 20px;">
        {% block content %}{% endblock %}
    </main>

    
     
     
   
</body>
</html>
